<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DSwifi - Aviso de pago</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
    }

    .caja {
      width: 90%;
      max-width: 420px;
      background: #1d1d1d;
      padding: 30px 20px;
      border-radius: 18px;
      box-shadow: 0 0 25px rgba(255, 193, 7, 0.25);
    }

    h1 {
      color: #ffc107;
      margin-bottom: 20px;
    }

    p {
      font-size: 18px;
      line-height: 1.5;
    }

    .boton {
      display: block;
      margin-top: 25px;
      padding: 16px;
      background: #ffc107;
      color: #111;
      text-decoration: none;
      font-weight: bold;
      border-radius: 10px;
    }

    .logo {
      font-size: 30px;
      font-weight: bold;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>

  <div class="caja">
    <div class="logo">DSwifi</div>

    <h1>AVISO DE PAGO</h1>

    <p>
      Tiene un pago pendiente de su servicio de Internet.
    </p>

    <p>
      Si ya realizaste el pago, olvida este mensaje.
    </p>

    <a class="boton"
       href="https://wa.me/18295361123?text=Hola%20DSwifi,%20quiero%20reportar%20mi%20pago%20de%20Internet.">
       REPORTAR TU PAGO POR WHATSAPP
    </a>
  </div>

</body>
</html>
