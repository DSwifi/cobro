<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DSwifi - Aviso de Pago</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial, Helvetica, sans-serif;
    background:
        radial-gradient(circle at 50% 5%, #ffd84d 0%, #d79a00 25%, #8a5700 55%, #3b2100 100%);
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    color:white;
}

.contenido{
    width:92%;
    max-width:650px;
}

.logo{
    font-size:58px;
    font-weight:900;
    font-style:italic;
    margin-bottom:25px;
    color:white;
    text-shadow:5px 5px 3px #222;
}

.logo span{
    color:#ffd400;
}

.aviso{
    position:relative;
    background:linear-gradient(#e00000,#a40000);
    border:4px solid white;
    border-radius:28px;
    padding:30px 15px 20px;
    box-shadow:0 8px 22px rgba(0,0,0,.45);
    margin-bottom:45px;
}

.icono-alerta{
    position:absolute;
    top:-45px;
    left:50%;
    transform:translateX(-50%);
    width:85px;
    height:85px;
    border-radius:50%;
    background:#e21b1b;
    border:4px solid white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:62px;
    font-weight:bold;
}

.aviso h1{
    margin:5px 0 0;
    font-size:52px;
    line-height:.95;
    text-shadow:3px 3px 3px #333;
}

.aviso h1 span{
    color:#ffd400;
}

.pendiente{
    font-size:34px;
    font-weight:900;
    line-height:1.2;
    margin-bottom:28px;
    text-shadow:3px 3px 3px #333;
}

.pendiente span{
    color:#ffd400;
}

.pagado{
    background:white;
    color:#111;
    border-radius:22px;
    padding:20px;
    font-size:26px;
    font-weight:bold;
    margin-bottom:22px;
    box-shadow:0 5px 15px rgba(0,0,0,.3);
}

.pagado span{
    color:#075dcc;
}

.whatsapp{
    display:block;
    text-decoration:none;
    background:linear-gradient(#12bd42,#008823);
    color:white;
    border:4px solid #3cff65;
    border-radius:25px;
    padding:22px 15px;
    font-size:28px;
    font-weight:900;
    box-shadow:0 0 20px #18ff50;
}

.whatsapp span{
    font-size:38px;
    vertical-align:middle;
    margin-right:8px;
}

@media(max-width:600px){

    .logo{
        font-size:48px;
    }

    .aviso h1{
        font-size:43px;
    }

    .pendiente{
        font-size:27px;
    }

    .pagado{
        font-size:22px;
    }

    .whatsapp{
        font-size:23px;
    }
}
</style>
</head>

<body>

<div class="contenido">

    <div class="logo">
        DS<span>wifi</span>
    </div>

    <div class="aviso">

        <div class="icono-alerta">!</div>

        <h1>
            AVISO DE<br>
            <span>PAGO</span>
        </h1>

    </div>

    <div class="pendiente">
        Tiene un <span>pago pendiente</span><br>
        de su <span>servicio de Internet.</span>
    </div>

    <div class="pagado">
        ℹ️ &nbsp; Si ya realizaste el pago,<br>
        <span>olvida este mensaje.</span>
    </div>

    <a class="whatsapp" href="#">
        <span>💬</span>
        REPORTAR TU PAGO<br>
        POR WHATSAPP ❯
    </a>

</div>

</body>
</html>
