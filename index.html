<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DSwifi - Aviso de Pago</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    min-height:100vh;
    background:
        radial-gradient(circle at 50% 5%, #ffd900 0%, #b57900 12%, transparent 30%),
        radial-gradient(circle at 10% 45%, #ffb300 0%, transparent 25%),
        radial-gradient(circle at 90% 40%, #ff9d00 0%, transparent 25%),
        linear-gradient(145deg,#120900,#6b4000,#1b0c00);
    display:flex;
    justify-content:center;
    color:#fff;
}

.pagina{
    width:100%;
    max-width:520px;
    min-height:100vh;
    padding:18px 18px 28px;
    text-align:center;
}

/* DSwifi */
.marca{
    margin:0 0 10px;
    font-size:64px;
    line-height:1;
    font-weight:900;
    font-style:italic;
    letter-spacing:-3px;
    color:white;
    text-shadow:
        4px 4px 0 #000,
        0 0 15px #ffb700;
}

.marca span{
    color:#ffd400;
}

/* símbolo wifi */
.wifi{
    color:#ffd400;
    font-size:48px;
    margin-bottom:5px;
}

/* aviso rojo */
.aviso{
    position:relative;
    background:linear-gradient(#ff1717,#c90000);
    border:4px solid white;
    border-radius:28px;
    padding:28px 12px 20px;
    box-shadow:
        0 0 18px #ffbf00,
        0 8px 15px rgba(0,0,0,.55);
    margin:10px 4px 25px;
}

.alerta{
    position:absolute;
    width:82px;
    height:82px;
    border-radius:50%;
    top:-48px;
    left:50%;
    transform:translateX(-50%);
    background:linear-gradient(#ff5252,#e00000);
    border:4px solid white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:58px;
    font-weight:900;
    box-shadow:0 0 14px #ffcc00;
}

.aviso-arriba{
    font-size:45px;
    font-weight:900;
    line-height:1;
    text-shadow:3px 3px 3px #650000;
}

.aviso-pago{
    font-size:58px;
    font-weight:900;
    line-height:1;
    color:#ffe000;
    text-shadow:3px 3px 2px #7c0000;
}

/* mensaje */
.mensaje{
    font-size:31px;
    font-weight:900;
    line-height:1.12;
    margin:16px 5px 20px;
    text-shadow:2px 3px 3px #000;
}

.mensaje span{
    color:#ffd400;
}

/* cuadro blanco */
.ya-pago{
    background:linear-gradient(#fffef7,#f5eacb);
    color:#132743;
    border-radius:22px;
    padding:18px 12px;
    margin:0 0 16px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    box-shadow:0 0 12px #ffc400;
}

.info{
    width:54px;
    height:54px;
    flex:0 0 54px;
    border-radius:50%;
    background:#087cff;
    color:white;
    font-size:39px;
    font-family:Georgia,serif;
    font-weight:bold;
    font-style:italic;
    display:flex;
    align-items:center;
    justify-content:center;
}

.ya-texto{
    font-size:23px;
    line-height:1.12;
    font-weight:900;
    text-align:left;
}

.ya-texto span{
    color:#0868e8;
}

/* WhatsApp */
.whatsapp{
    width:100%;
    min-height:105px;
    border-radius:24px;
    border:3px solid #66ff66;
    background:linear-gradient(#0bc83c,#00841e);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:12px 15px;
    text-decoration:none;
    color:white;
    box-shadow:
        0 0 15px #00ff35,
        0 8px 15px rgba(0,0,0,.5);
}

.wa-icon{
    font-size:56px;
    margin-right:13px;
}

.wa-texto{
    border-left:2px solid white;
    padding-left:14px;
    font-size:25px;
    line-height:1.12;
    font-weight:900;
    text-align:left;
}

.flecha{
    font-size:50px;
    margin-left:10px;
    font-weight:bold;
}

/* pantallas pequeñas */
@media(max-width:390px){

    .pagina{
        padding:17px 13px 22px;
    }

    .marca{
        font-size:54px;
    }

    .aviso-arriba{
        font-size:38px;
    }

    .aviso-pago{
        font-size:51px;
    }

    .mensaje{
        font-size:27px;
    }

    .ya-texto{
        font-size:20px;
    }

    .wa-texto{
        font-size:21px;
    }
}
</style>
</head>

<body>

<div class="pagina">

    <div class="wifi">●</div>

    <div class="marca">
        DS<span>wifi</span>
    </div>

    <div class="aviso">

        <div class="alerta">!</div>

        <div class="aviso-arriba">
            AVISO DE
        </div>

        <div class="aviso-pago">
            PAGO
        </div>

    </div>

    <div class="wifi">⌁</div>

    <div class="mensaje">
        Tiene un pago pendiente<br>
        de su <span>servicio de Internet.</span>
    </div>

    <div class="ya-pago">

        <div class="info">i</div>

        <div class="ya-texto">
            Si ya realizaste el pago,<br>
            <span>olvida este mensaje.</span>
        </div>

    </div>

    <a class="whatsapp"
       href="https://wa.me/18295361123"
       target="_blank">

        <div class="wa-icon">💬</div>

        <div class="wa-texto">
            REPORTAR TU PAGO<br>
            POR WHATSAPP
        </div>

        <div class="flecha">›</div>

    </a>

</div>

</body>
</html>
