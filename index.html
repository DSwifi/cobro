<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DSwifi - Aviso de Pago</title>

<style>
*{box-sizing:border-box;}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    background:radial-gradient(circle at 50% 0%,
        #ffe56b 0%,#ffc400 20%,#a86a00 60%,#3b2100 100%);
    color:white;
    text-align:center;
}

.contenido{
    width:94%;
    max-width:620px;
    margin:auto;
    padding:20px 0 25px;
}

.logo{
    font-size:48px;
    font-weight:900;
    font-style:italic;
    margin:0 0 35px;
    text-shadow:4px 4px 4px #222;
}

.logo span{color:#ffd400;}

.aviso{
    position:relative;
    background:linear-gradient(#e71919,#990000);
    border:4px solid white;
    border-radius:24px;
    padding:30px 12px 18px;
    margin-bottom:24px;
    box-shadow:0 0 15px #ffd000;
}

.icono-alerta{
    position:absolute;
    top:-35px;
    left:50%;
    transform:translateX(-50%);
    width:68px;
    height:68px;
    border-radius:50%;
    background:#e71919;
    border:4px solid white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:48px;
    font-weight:900;
}

.aviso h1{
    margin:0;
    font-size:39px;
    line-height:1;
    text-shadow:3px 3px 3px #500000;
}

.aviso h1 span{
    color:#ffe000;
    font-size:51px;
}

.pendiente{
    font-size:29px;
    font-weight:900;
    line-height:1.15;
    margin:0 0 24px;
    color:white;
    text-shadow:2px 2px 3px #000,-1px -1px 2px #000;
}

.pendiente span{
    color:#39ff14;
    text-shadow:2px 2px 3px #000,-1px -1px 2px #000;
}

.pagado{
    background:linear-gradient(#ffffff,#eee9dd);
    color:#102d5c;
    border:3px solid white;
    border-radius:18px;
    padding:14px 10px;
    font-size:20px;
    font-weight:900;
    margin-bottom:18px;
    box-shadow:0 0 10px #ffc400;
}

.pagado span{color:#0868e8;}

.notificaciones{
    width:100%;
    cursor:pointer;
    background:linear-gradient(#147cff,#064aa5);
    color:white;
    border:3px solid #52b8ff;
    border-radius:18px;
    padding:15px 8px;
    font-size:20px;
    font-weight:900;
    margin-bottom:16px;
    box-shadow:0 0 10px #1785ff;
}

#estado{
    font-size:15px;
    font-weight:bold;
    margin:0 0 12px;
}

.whatsapp{
    width:100%;
    display:block;
    text-decoration:none;
    background:linear-gradient(#10ce43,#007d21);
    color:white;
    border:3px solid #40f46a;
    border-radius:18px;
    padding:15px 8px;
    font-size:21px;
    font-weight:900;
    box-shadow:0 0 12px #19ff50;
}

@media(max-width:600px){
    .contenido{
        width:94%;
        padding-top:18px;
    }

    .logo{
        font-size:45px;
        margin-bottom:34px;
    }

    .aviso{margin-bottom:22px;}
    .aviso h1{font-size:36px;}
    .aviso h1 span{font-size:48px;}

    .pendiente{
        font-size:27px;
        margin-bottom:22px;
    }

    .pagado{
        font-size:19px;
        margin-bottom:16px;
    }

    .notificaciones{
        font-size:19px;
        margin-bottom:15px;
    }

    .whatsapp{font-size:19px;}
}
</style>
</head>

<body>

<div class="contenido">

    <div class="logo">
        DS<span>wifi</span>
    </div>

    <div class="aviso">
        <div class="icono-alerta">!</div>

        <h1>
            AVISO DE<br>
            <span>PAGO</span>
        </h1>
    </div>

    <div class="pendiente">
        Tiene un <span>pago pendiente</span><br>
        de su servicio de Internet.
    </div>

    <div class="pagado">
        ℹ️ Si ya realizaste el pago,<br>
        <span>olvida este mensaje.</span>
    </div>

    <button class="notificaciones" id="activarNotificaciones">
        🔔 ACTIVAR NOTIFICACIONES DSWIFI
    </button>

    <div id="estado"></div>

    <a class="whatsapp"
       href="https://wa.me/18295361123?text=Hola%20DSwifi,%20quiero%20reportar%20mi%20pago%20de%20Internet."
       target="_blank">
        💬 REPORTAR TU PAGO POR WHATSAPP ❯
    </a>

</div>

<script src="https://www.gstatic.com/firebasejs/12.4.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.4.0/firebase-messaging-compat.js"></script>

<script>

const firebaseConfig = {
    apiKey: "AIzaSyCsROoMjXx0iLjoLbkh9u_4U0BZr_bQyU0",
    authDomain: "dswifi.firebaseapp.com",
    projectId: "dswifi",
    storageBucket: "dswifi.firebasestorage.app",
    messagingSenderId: "874160724103",
    appId: "1:874160724103:web:92a1693f14dddad8380022"
};

firebase.initializeApp(firebaseConfig);

const messaging = firebase.messaging();

const vapidKey =
"BFQzkyLlzSI1nDzYx3WMcCMNbNwtBo9LwSkB1TUarV7T5XMRd0MUwDnclamFtGmGgkeaK890ekcd3oCSy-FL7OE";

document.getElementById("activarNotificaciones")
.addEventListener("click", async function(){

    const estado = document.getElementById("estado");

    try{

        estado.innerText = "Activando notificaciones...";

        const permiso = await Notification.requestPermission();

        if(permiso !== "granted"){
            estado.innerText =
                "❌ No se permitieron las notificaciones.";
            return;
        }

        const registro =
            await navigator.serviceWorker.register(
                "./firebase-messaging-sw.js"
            );

        const token = await messaging.getToken({
            vapidKey:vapidKey,
            serviceWorkerRegistration:registro
        });

        if(token){

            localStorage.setItem("dswifiToken",token);

            estado.innerText =
                "✅ Notificaciones DSwifi activadas correctamente.";

            document.getElementById(
                "activarNotificaciones"
            ).innerText =
                "✅ NOTIFICACIONES ACTIVADAS";

            setTimeout(function(){
                prompt(
                    "COPIA ESTE TOKEN DSWIFI:",
                    token
                );
            },500);

        }else{

            estado.innerText =
                "❌ No se pudo registrar este celular.";
        }

    }catch(error){

        console.error(error);

        estado.innerText =
            "❌ Error al activar las notificaciones.";
    }
});

</script>

</body>
</html>
