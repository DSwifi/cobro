<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DSwifi - Aviso de Pago</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#0d0d0d;
    color:white;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:18px;
}

.card{
    width:100%;
    max-width:420px;
    background:#181818;
    border:2px solid #d4a72c;
    border-radius:22px;
    padding:32px 22px;
    text-align:center;
    box-shadow:0 10px 35px rgba(0,0,0,.6);
}

.logo{
    font-size:40px;
    font-weight:bold;
    color:#d4a72c;
    margin-bottom:5px;
}

.internet{
    font-size:15px;
    color:#aaa;
    margin-bottom:28px;
}

.icono{
    font-size:45px;
    margin-bottom:10px;
}

h1{
    color:#d4a72c;
    font-size:27px;
    margin:0 0 20px;
}

p{
    color:#ddd;
    font-size:18px;
    line-height:1.5;
    margin:12px 0;
}

.pendiente{
    color:#d4a72c;
    font-weight:bold;
}

.whatsapp{
    display:block;
    margin-top:28px;
    background:#25D366;
    color:white;
    text-decoration:none;
    padding:17px 12px;
    border-radius:13px;
    font-size:17px;
    font-weight:bold;
}

.pie{
    margin-top:25px;
    color:#777;
    font-size:13px;
}
</style>
</head>

<body>

<div class="card">

    <div class="logo">DSwifi</div>
    <div class="internet">Servicio de Internet</div>

    <div class="icono">⚠️</div>

    <h1>AVISO DE PAGO</h1>

    <p>
        Tiene un <span class="pendiente">pago pendiente</span>
        de su servicio de Internet.
    </p>

    <p>
        Para evitar la suspensión del servicio,
        favor realizar su pago.
    </p>

    <p>
        Si ya realizó el pago, ignore este aviso.
    </p>

    <a class="whatsapp"
       href="https://wa.me/18295361123?text=Hola%20DSwifi,%20quiero%20reportar%20mi%20pago%20de%20Internet.">
       REPORTAR PAGO POR WHATSAPP
    </a>

    <div class="pie">
        DSwifi
    </div>

</div>

</body>
</html>
