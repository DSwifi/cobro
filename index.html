<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DSwifi - Aviso de Pago</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    min-height:100%;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    min-height:100vh;
    background:
      radial-gradient(circle at 50% 0%,#b98200 0%,#704500 30%,#3b2100 65%,#241200 100%);
    color:white;
    display:flex;
    justify-content:center;
}

.pagina{
    width:100%;
    max-width:650px;
    min-height:100vh;
    padding:30px 25px 35px;
    text-align:center;
}

/* LOGO */
.marca{
    margin:0 0 45px;
    font-size:72px;
    line-height:1;
    font-weight:900;
    font-style:italic;
    letter-spacing:-5px;
    color:#fff;
    text-shadow:5px 5px 2px #000;
}

.marca span{
    color:#ffd400;
}

/* AVISO ROJO */
.aviso{
    position:relative;
    background:linear-gradient(#d51414,#a90000);
    border:4px solid white;
    border-radius:30px;
    padding:35px 15px 22px;
    box-shadow:
       0 0 18px #d7a900,
       0 8px 18px rgba(0,0,0,.55);
    margin-bottom:65px;
}

.alerta{
    position:absolute;
    width:92px;
    height:92px;
    border-radius:50%;
    top:-55px;
    left:50%;
    transform:translateX(-50%);
    background:linear-gradient(#f33,#c40000);
    border:4px solid white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:67px;
    font-weight:900;
    color:white;
    box-shadow:0 0 12px #d9a700;
}

.aviso1{
    font-size:54px;
    font-weight:900;
    line-height:1;
    text-shadow:3px 3px 3px #650000;
}

.aviso2{
    font-size:65px;
    font-weight:900;
    line-height:1.05;
    color:#ffd400;
    text-shadow:3px 3px 3px #650000;
}

/* PAGO PENDIENTE */
.mensaje{
    font-size:36px;
    line-height:1.15;
    font-weight:900;
    margin:0 5px 28px;
    text-shadow:3px 3px 3px #000;
}

.mensaje span{
    color:#ffd400;
}

/* SI YA PAGÓ */
.pagado{
    background:linear-gradient(#fff,#eee8d8);
    color:#102541;
    border-radius:25px;
    padding:20px;
    margin-bottom:22px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:18px;
    box-shadow:0 0 14px #d4a500;
}

.info{
    width:60px;
    height:60px;
    flex:0 0 60px;
    border-radius:50%;
    background:#0879ed;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Georgia,serif;
    font-style:italic;
    font-weight:bold;
    font-size:43px;
}

.pagado-texto{
    text-align:left;
    font-size:27px;
    line-height:1.1;
    font-weight:900;
}

.pagado-texto span{
    color:#0664dc;
}

/* WHATSAPP */
.whatsapp{
    width:100%;
    min-height:120px;
    background:linear-gradient(#09b636,#007a20);
    border:4px solid #39ed63;
    border-radius:27px;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:15px;
    text-decoration:none;
    color:white;
    box-shadow:
       0 0 18px #00d941,
       0 8px 18px rgba(0,0,0,.5);
}

.wa-icon{
    font-size:60px;
    padding-right:18px;
}

.wa-texto{
    border-left:2px solid white;
    padding-left:18px;
    text-align:left;
    font-size:29px;
    line-height:1.08;
    font-weight:900;
}

.flecha{
    margin-left:18px;
    font-size:55px;
    font-weight:900;
}

/* CELULAR */
@media(max-width:500px){

    .pagina{
        padding:22px 18px 25px;
    }

    .marca{
        font-size:58px;
        margin-bottom:48px;
    }

    .aviso{
        margin-bottom:55px;
    }

    .aviso1{font-size:43px}
    .aviso2{font-size:55px}

    .mensaje{font-size:29px}

    .pagado-texto{font-size:22px}

    .wa-texto{font-size:23px}

    .wa-icon{font-size:48px}

    .flecha{
        font-size:45px;
        margin-left:8px;
    }
}
</style>
</head>

<body>

<div class="pagina">

    <div class="marca">
        DS<span>wifi</span>
    </div>

    <div class="aviso">
        <div class="alerta">!</div>

        <div class="aviso1">AVISO DE</div>
        <div class="aviso2">PAGO</div>
    </div>

    <div class="mensaje">
        Tiene un pago pendiente<br>
        de su <span>servicio de Internet.</span>
    </div>

    <div class="pagado">

        <div class="info">i</div>

        <div class="pagado-texto">
            Si ya realizaste el pago,<br>
            <span>olvida este mensaje.</span>
        </div>

    </div>

    <a class="whatsapp"
       href="https://wa.me/18295361123"
       target="_blank">

        <div class="wa-icon">💬</div>

        <div class="wa-texto">
            REPORTAR TU PAGO<br>
            POR WHATSAPP
        </div>

        <div class="flecha">›</div>

    </a>

</div>

</body>
</html>
